spring.application.name=messaging

# Local runs use 8093 so the monolith (8080), Identity (8091) and Clinical (8092) can run at the same time. In
# Kubernetes every service listens on 8080 (SERVER_PORT=8080). See docs/architecture.md §8.
server.port=${SERVER_PORT:8093}

# Signs service tokens as "messaging" (docs/architecture.md §9).
medinexus.service-name=messaging

# JWT cookie (NIT-327). JWT_SECRET must be the same in every service.
medinexus.jwt.secret=${JWT_SECRET}
medinexus.jwt.ttl=30m
medinexus.jwt.secure-cookie=${JWT_COOKIE_SECURE:false}

# Database: the shared Postgres instance, but only the "messaging" schema, as user messaging_svc (NIT-324).
# messaging_svc has no rights on other schemas, so a query against another service's tables fails.
spring.datasource.url=${DB_URL}
spring.datasource.username=${MESSAGING_DB_USERNAME:messaging_svc}
spring.datasource.password=${MESSAGING_DB_PASSWORD}

# Hibernate never changes the schema; unqualified table names resolve to "messaging".
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=messaging

# Flyway runs Messaging's own migrations (src/main/resources/db/migration) inside "messaging", with its own history
# table messaging.flyway_schema_history. Never baseline or clean automatically.
spring.flyway.schemas=messaging
spring.flyway.default-schema=messaging
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Identity's internal API I1-I2 (docs/architecture.md §13): names and roles of accounts. In Kubernetes
# IDENTITY_URL=http://identity:8080.
medinexus.identity.url=${IDENTITY_URL:http://localhost:8091}
