spring.application.name=identity

# Local runs use 8091 so the monolith (8080) and later services can run at the same time. Not 8081: that is Expo's
# Metro port. In Kubernetes every service listens on 8080 (SERVER_PORT=8080). See docs/architecture.md §8.
server.port=${SERVER_PORT:8091}

# Signs service tokens as "identity" (docs/architecture.md §9).
medinexus.service-name=identity

# JWT cookie (NIT-327). JWT_SECRET must be the same in every service.
medinexus.jwt.secret=${JWT_SECRET}
medinexus.jwt.ttl=30m
medinexus.jwt.secure-cookie=${JWT_COOKIE_SECURE:false}

# Database: the shared Postgres instance, but only the "identity" schema, as user identity_svc (NIT-324).
# identity_svc has no rights on other schemas, so a query against another service's tables fails.
spring.datasource.url=${DB_URL}
spring.datasource.username=${IDENTITY_DB_USERNAME:identity_svc}
spring.datasource.password=${IDENTITY_DB_PASSWORD}

# Hibernate never changes the schema; unqualified table names resolve to "identity".
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=identity

# Flyway runs Identity's own migrations (src/main/resources/db/migration) inside "identity", with its own history
# table identity.flyway_schema_history. Never baseline or clean automatically.
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Clinical's internal API (docs/architecture.md §12). Until the Clinical service exists, the monolith serves it on
# 8080; then CLINICAL_URL becomes http://localhost:8092 (in Kubernetes http://clinical:8080).
medinexus.clinical.url=${CLINICAL_URL:http://localhost:8080}

# CORS for /api/** - explicit origins only (comma-separated, no wildcards). Default: the MediPortal Vite dev server.
medinexus.cors.allowed-origins=http://localhost:5173
