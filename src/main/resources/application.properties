spring.application.name=MediNexus

# Stateless login (NIT-327): a signed JWT in the HttpOnly, SameSite=Strict cookie "medicore_token" replaces the HTTP
# session. JWT_SECRET is required (at least 32 bytes) and must be the same in every service; generate one with
#   openssl rand -base64 48
# Enable Secure cookies when deployed over HTTPS. The token lives 30 minutes and is renewed by GET /api/auth/me.
medinexus.jwt.secret=${JWT_SECRET}
medinexus.jwt.ttl=30m
medinexus.jwt.secure-cookie=${JWT_COOKIE_SECURE:false}

# Datasource - supplied through environment variables (never commit credentials).
# See infrastructure/database/README.md for local setup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Hibernate never creates, updates or drops tables; the schema is managed by Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway - applies src/main/resources/db/migration on startup, using the datasource above.
# An existing database without Flyway history must be baselined once, explicitly
# (see infrastructure/database/README.md). Never baseline or clean automatically.
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# CORS for /api/** - explicit origins only (comma-separated, no wildcards).
# Default: the MediPortal Vite dev server. Override with MEDINEXUS_CORS_ALLOWED_ORIGINS.
medinexus.cors.allowed-origins=http://localhost:5173

# External FHIR server (HAPI FHIR, R4). Public URL, no credentials. Override with FHIR_BASE_URL.
medinexus.fhir.base-url=${FHIR_BASE_URL:https://hapi-fhir.app.cloud.cbh.kth.se/fhir}
medinexus.fhir.connect-timeout=10s
medinexus.fhir.socket-timeout=30s
medinexus.fhir.connection-request-timeout=10s
