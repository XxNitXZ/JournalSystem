spring.application.name=MediNexus

# In-memory HTTP sessions; enable Secure cookies when deployed over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Datasource - supplied through environment variables (never commit credentials).
# See infrastructure/database/README.md for local setup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Hibernate never creates, updates or drops tables; the schema is managed by Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway - applies src/main/resources/db/migration on startup, using the datasource above.
# An existing database without Flyway history must be baselined once, explicitly
# (see infrastructure/database/README.md). Never baseline or clean automatically.
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# CORS for /api/** - explicit origins only (comma-separated, no wildcards).
# Default: the MediPortal Vite dev server. Override with MEDINEXUS_CORS_ALLOWED_ORIGINS.
medinexus.cors.allowed-origins=http://localhost:5173
